<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee5"/>
      <stop offset="1" stop-color="#e7ddcd"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5eee1"/>
      <stop offset="1" stop-color="#e4d7c2"/>
    </linearGradient>
    <linearGradient id="ecru" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe5d3"/>
      <stop offset="1" stop-color="#d9cbb2"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c2a37"/>
      <stop offset="1" stop-color="#661923"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a2a1c" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3a2a1c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stitch" width="34" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 16 Q 8.5 2 17 16 T 34 16" fill="none" stroke="#b3a184" stroke-width="2" opacity="0.35"/>
    </pattern>
    <pattern id="stitchLight" width="30" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 14 Q 7.5 2 15 14 T 30 14" fill="none" stroke="#f4e8dd" stroke-width="1.8" opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="url(#wall)"/>
  <rect y="1210" width="1200" height="290" fill="#ded2bf"/>
  <rect y="1208" width="1200" height="2" fill="#c9baa2"/>
  <ellipse cx="600" cy="1235" rx="470" ry="62" fill="url(#shadow)"/>

  <g transform="rotate(-2 600 1110)">
    <rect x="140" y="960" width="920" height="300" rx="30" fill="url(#cream)"/>
    <rect x="140" y="1042" width="920" height="58" fill="url(#wine)" opacity="0.94"/>
    <rect x="140" y="1104" width="920" height="10" fill="#a67c4a" opacity="0.65"/>
    <rect x="140" y="960" width="920" height="300" rx="30" fill="url(#stitch)"/>
    <path d="M140 1000 C 320 1034 820 1034 1060 1000" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.22"/>
  </g>

  <g transform="rotate(1.5 600 860)">
