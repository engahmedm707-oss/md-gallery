    <rect x="200" y="862" width="800" height="8" fill="#7a1f2b" opacity="0.7"/>
    <rect x="200" y="742" width="800" height="252" rx="28" fill="url(#stitch)"/>
    <path d="M200 780 C 380 810 820 810 1000 780" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.2"/>
  </g>

  <g transform="rotate(-1 600 650)">
