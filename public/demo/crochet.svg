    <circle cx="20" cy="20" r="4" fill="#a67c4a"/>
    <path d="M20 24 L14 46" stroke="#a67c4a" stroke-width="2"/>
    <path d="M20 24 L40 44" stroke="#a67c4a" stroke-width="2"/>
